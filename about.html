<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="about.pageTitle">About Us | Avalon</title>
  <meta name="description" data-i18n-content="about.metaDescription" content="">
  <!-- Brand marks. The SVG icon is the primary one and stays crisp at every
       size; the PNG covers iOS home screens and older browsers. -->
  <link rel="icon" href="images/brand/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="images/brand/appleTouchIcon.png">
  <meta name="theme-color" content="#1E1C19">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/avalon.css">

  <script>
    (function () {
      var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      if (!reduce) document.documentElement.classList.add("gsapReady");
    })();
  </script>
</head>

<body data-page="about">

  <noscript>
    <p class="noscriptNotice">This site needs JavaScript to display its content.</p>
  </noscript>

  <a class="skipLink" href="#mainContent" data-i18n="nav.skipToContent">Skip to main content</a>
  <div data-site-header></div>

  <main id="mainContent">

    <!-- ================================================================ HERO -->
    <section class="pageHero" data-hero>
      <div class="heroMedia" data-parallax="0.07">
        <img src="images/house/houseSideEntrance.jpg" data-i18n-alt="media.altSideEntrance" alt="" fetchpriority="high">
      </div>
      <div class="heroScrim"></div>
      <div class="heroContent">
        <div class="sectionShell">
          <span class="eyebrow" data-hero-item data-i18n="about.heroEyebrow"></span>
          <h1 class="displayLg heroTitle" data-hero-item data-i18n="about.heroTitle"></h1>
          <p class="heroLede" data-hero-item data-i18n="about.heroLede"></p>
        </div>
      </div>
    </section>

    <!-- ============================================================= SUB NAV -->
    <nav class="subNav" aria-label="Sections of this page">
      <div class="subNavInner">
        <a class="subNavLink" href="#beliefs"  data-i18n="navSub.beliefs"></a>
        <a class="subNavLink" href="#joinTeam" data-i18n="navSub.joinTeam"></a>
      </div>
    </nav>

    <!-- ============================================================ BELIEFS -->
    <section class="sectionBlock" id="beliefs">
      <div class="sectionShell">

        <div class="sectionHead shellMid revealItem shellFlush">
          <h2 class="displayLg" data-i18n="about.beliefsTitle"></h2>
          <p class="leadText" data-i18n="about.beliefsLead"></p>
        </div>

        <div class="stackMd shellMid revealItem shellFlush"
             data-i18n-paras="about.beliefsParagraphs"></div>

      </div>
    </section>

    <!-- =========================================================== JOIN TEAM -->
    <section class="sectionBlock bandParchmentDeep" id="joinTeam">
      <div class="sectionShell">
        <div class="splitBlock">

          <div class="revealItem">
            <h2 class="displayLg" data-i18n="about.joinTitle"></h2>
            <p class="leadText marginTopLg" data-i18n="about.joinLead"></p>
            <!-- PLACEHOLDER: partner institute, roles and start dates to confirm. -->
          </div>

          <div class="revealItem">
            <div class="formShell">

              <!-- PLACEHOLDER: not connected to a backend. See js/avalon.js. -->
              <form class="avalonForm" data-confirmation="teamConfirmation" novalidate>
                <div class="formGrid">

                  <div class="fieldGroup fieldFull">
                    <label class="fieldLabel" for="teamName" data-i18n="forms.labelName"></label>
                    <input class="inputField" type="text" id="teamName" name="name"
                           autocomplete="name" data-required aria-describedby="teamNameError">
                    <span class="fieldError" id="teamNameError" role="alert"></span>
                  </div>

                  <div class="fieldGroup">
                    <label class="fieldLabel" for="teamEmail" data-i18n="forms.labelEmail"></label>
                    <input class="inputField" type="email" id="teamEmail" name="email"
                           autocomplete="email" data-required data-validate="email"
                           aria-describedby="teamEmailError">
                    <span class="fieldError" id="teamEmailError" role="alert"></span>
                  </div>

                  <div class="fieldGroup">
                    <label class="fieldLabel" for="teamSpecialty" data-i18n="forms.labelSpecialty"></label>
                    <select class="selectField" id="teamSpecialty" name="specialty"
                            data-required aria-describedby="teamSpecialtyError">
                      <option value="" data-i18n="forms.specialtyDefault"></option>
                      <option value="psychiatry" data-i18n="forms.specialtyPsychiatry"></option>
                      <option value="psychology" data-i18n="forms.specialtyPsychology"></option>
                      <option value="nursing" data-i18n="forms.specialtyNursing"></option>
                      <option value="psychotherapy" data-i18n="forms.specialtyPsychotherapy"></option>
                      <option value="other" data-i18n="forms.specialtyOther"></option>
                    </select>
                    <span class="fieldError" id="teamSpecialtyError" role="alert"></span>
                  </div>

                  <div class="fieldGroup fieldFull">
                    <label class="fieldLabel" for="teamNote">
                      <span data-i18n="forms.labelNote"></span>
                      <span class="fieldOptional">(<span data-i18n="forms.optional"></span>)</span>
                    </label>
                    <textarea class="textareaField" id="teamNote" name="note" rows="4"></textarea>
                  </div>

                </div>

                <div class="formActions">
                  <button class="buttonPrimary" type="submit" data-i18n="forms.submitTeam"></button>
                </div>

                <p class="formConsent marginTopLg" data-i18n="forms.consent"></p>
              </form>

              <div class="formConfirmation" id="teamConfirmation">
                <h3 class="formConfirmationTitle" data-i18n="forms.teamConfirmTitle"></h3>
                <div class="stackMd" data-i18n-paras="forms.teamConfirmBody"></div>
              </div>

            </div>
          </div>

        </div>
      </div>
    </section>

  </main>

  <div data-site-footer></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
  <script src="js/content.en.js"></script>
  <script src="js/content.pt.js"></script>
  <script src="js/chrome.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/avalon.js"></script>
  <script src="js/animations.js"></script>
</body>
</html>
