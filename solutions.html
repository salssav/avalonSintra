<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="solutions.pageTitle">Solutions | Avalon</title>
  <meta name="description" data-i18n-content="solutions.metaDescription" content="">
  <!-- Brand marks. The SVG icon is the primary one and stays crisp at every
       size; the PNG covers iOS home screens and older browsers. -->
  <link rel="icon" href="images/brand/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="images/brand/appleTouchIcon.png">
  <meta name="theme-color" content="#1E1C19">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/avalon.css">

  <script>
    (function () {
      var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      if (!reduce) document.documentElement.classList.add("gsapReady");
    })();
  </script>
</head>

<body data-page="solutions">

  <noscript>
    <p class="noscriptNotice">This site needs JavaScript to display its content.</p>
  </noscript>

  <a class="skipLink" href="#mainContent" data-i18n="nav.skipToContent">Skip to main content</a>
  <div data-site-header></div>

  <main id="mainContent">

    <!-- ================================================================ HERO -->
    <section class="pageHero" data-hero>
      <div class="heroMedia" data-parallax="0.07">
        <img src="sources/fotosExt/cuteSofa.jpg" data-i18n-alt="media.altStaircase" alt="" fetchpriority="high">
      </div>
      <div class="heroScrim"></div>
      <div class="heroContent">
        <div class="sectionShell">
          <span class="eyebrow" data-hero-item data-i18n="solutions.heroEyebrow"></span>
          <h1 class="displayLg heroTitle" data-hero-item data-i18n="solutions.heroTitle"></h1>
          <p class="heroLede" data-hero-item data-i18n="solutions.heroLede"></p>
        </div>
      </div>
    </section>

    <!-- ============================================================= SUB NAV -->
    <nav class="subNav" aria-label="Sections of this page">
      <div class="subNavInner">
        <a class="subNavLink" href="#dbt"         data-i18n="navSub.dbt"></a>
        <a class="subNavLink" href="#emdr"        data-i18n="navSub.emdr"></a>
        <a class="subNavLink" href="#mindfulness" data-i18n="navSub.mindfulness"></a>
      </div>
    </nav>

    <!-- ================================================================= DBT -->
    <section class="sectionBlock" id="dbt">
      <div class="sectionShell">

        <div class="sectionHead revealItem">
          <span class="eyebrow" data-i18n="navSub.dbt"></span>
          <h2 class="displayLg" data-i18n="solutions.dbtTitle"></h2>
          <p class="leadText" data-i18n="solutions.dbtLead"></p>
        </div>

        <div class="contentSectionHead">
          <div class="contentSectionTitle revealItem">
            <h3 class="displaySm" data-i18n="solutions.dbtWhatTitle"></h3>
          </div>
          <div class="revealItem">
            <div class="stackMd" data-i18n-paras="solutions.dbtWhatParagraphs"></div>
          </div>
        </div>

        <!-- The four skill modules -->
        <div class="marginTopXl">
          <div class="revealItem">
            <h3 class="displaySm" data-i18n="solutions.dbtModulesTitle"></h3>
            <p class="bodyText marginTopLg" data-i18n="solutions.dbtModulesIntro"></p>
          </div>

          <div class="cardGrid revealStagger marginTopLg">
            <div class="plainCard">
              <span class="plainCardIndex">01</span>
              <h4 class="plainCardTitle" data-i18n="programs.moduleMindfulnessTitle"></h4>
              <p class="bodyText" data-i18n="programs.moduleMindfulnessText"></p>
            </div>
            <div class="plainCard">
              <span class="plainCardIndex">02</span>
              <h4 class="plainCardTitle" data-i18n="programs.moduleDistressTitle"></h4>
              <p class="bodyText" data-i18n="programs.moduleDistressText"></p>
            </div>
            <div class="plainCard">
              <span class="plainCardIndex">03</span>
              <h4 class="plainCardTitle" data-i18n="programs.moduleEmotionTitle"></h4>
              <p class="bodyText" data-i18n="programs.moduleEmotionText"></p>
            </div>
            <div class="plainCard">
              <span class="plainCardIndex">04</span>
              <h4 class="plainCardTitle" data-i18n="programs.moduleInterpersonalTitle"></h4>
              <p class="bodyText" data-i18n="programs.moduleInterpersonalText"></p>
            </div>
          </div>
        </div>

        <!-- DBT at Avalon -->
        <div class="contentSectionHead marginTopXl">
          <div class="contentSectionTitle revealItem">
            <h3 class="displaySm" data-i18n="solutions.dbtAtAvalonTitle"></h3>
          </div>
          <div class="revealItem">
            <div class="stackMd" data-i18n-paras="solutions.dbtAtAvalonParagraphs"></div>
            <!-- PLACEHOLDER: programme structure and team detail to follow. -->
            <p class="marginTopLg">
              <a class="linkQuiet" href="programs.html#therapies">
                <span data-i18n="solutions.dbtLink"></span>
                <span class="linkArrow" aria-hidden="true">&rarr;</span>
              </a>
            </p>
          </div>
        </div>

      </div>
    </section>

    <!-- ================================================================ EMDR -->
    <section class="sectionBlock bandParchmentDeep" id="emdr">
      <div class="sectionShell">

        <div class="sectionHead revealItem">
          <h2 class="displayLg" data-i18n="solutions.emdrTitle"></h2>
          <p class="leadText" data-i18n="solutions.emdrLead"></p>
        </div>

        <div class="splitBlock">
          <div class="splitMedia revealItem">
            <img src="sources/fotosExt/lightPhoto.jpg" data-i18n-alt="media.altCorridor" alt="" loading="lazy">
          </div>
          <div class="revealItem">
            <h3 class="displaySm" data-i18n="solutions.emdrWhatTitle"></h3>
            <div class="stackMd marginTopLg" data-i18n-paras="solutions.emdrWhatParagraphs"></div>

            <h3 class="displaySm marginTopXl" data-i18n="solutions.emdrSafetyTitle"></h3>
            <div class="stackMd marginTopLg" data-i18n-paras="solutions.emdrSafetyParagraphs"></div>

            <h3 class="displaySm marginTopXl" data-i18n="solutions.emdrAtAvalonTitle"></h3>
            <div class="stackMd marginTopLg" data-i18n-paras="solutions.emdrAtAvalonParagraphs"></div>
            <!-- PLACEHOLDER: named EMDR clinicians still to be confirmed. -->
          </div>
        </div>

      </div>
    </section>

    <!-- ========================================================= MINDFULNESS -->
    <section class="sectionBlock" id="mindfulness">
      <div class="sectionShell">
        <div class="splitBlock splitReverse">
          <div class="splitMedia revealItem">
            <img src="sources/fotosExt/blurySoundBowl.jpg" data-i18n-alt="media.altGardenWalledPath" alt="" loading="lazy">
          </div>
          <div class="revealItem">
            <span class="eyebrow" data-i18n="navSub.mindfulness"></span>
            <h2 class="displayMd" data-i18n="solutions.mindfulnessTitle"></h2>
            <p class="leadText marginTopLg" data-i18n="solutions.mindfulnessLead"></p>
            <div class="stackMd marginTopLg" data-i18n-paras="solutions.mindfulnessParagraphs"></div>
            <!-- PLACEHOLDER: schedule and practitioners to follow. -->
          </div>
        </div>

        <!-- ================================================== OUR OFFERS -->
        <div class="marginTopXl">
          <div class="revealItem">
            <h3 class="displaySm" data-i18n="solutions.offersTitle"></h3>
            <p class="bodyText marginTopLg" data-i18n="solutions.offersIntro"></p>
          </div>

          <div class="cardGrid revealStagger marginTopLg">
            <div class="plainCard">
              <h4 class="plainCardTitle" data-i18n="solutions.offerMeditationTitle"></h4>
            </div>
            <div class="plainCard">
              <h4 class="plainCardTitle" data-i18n="solutions.offerYogaTitle"></h4>
            </div>
            <div class="plainCard">
              <h4 class="plainCardTitle" data-i18n="solutions.offerWorkshopsTitle"></h4>
            </div>
          </div>
        </div>

      </div>
    </section>

    <!-- ================================================================= CTA -->
    <section class="sectionBlock ctaBand">
      <div class="sectionShell">
        <div class="ctaBandInner revealItem">
          <div>
            <span class="eyebrow" data-i18n="cta.eyebrow"></span>
            <h2 class="displayLg" data-i18n="cta.title"></h2>
            <p class="bodyText marginTopLg" data-i18n="cta.body"></p>
          </div>
          <div>
            <a class="buttonGhost" href="admissions.html#waitlist" data-i18n="cta.button"></a>
            <p class="marginTopLg">
              <a class="linkQuiet" href="admissions.html#process">
                <span data-i18n="cta.secondary"></span>
                <span class="linkArrow" aria-hidden="true">&rarr;</span>
              </a>
            </p>
            <p class="ctaBandAside marginTopLg" data-i18n="cta.aside"></p>
          </div>
        </div>
      </div>
    </section>

  </main>

  <div data-site-footer></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
  <script src="js/content.en.js"></script>
  <script src="js/content.pt.js"></script>
  <script src="js/chrome.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/avalon.js"></script>
  <script src="js/animations.js"></script>
</body>
</html>
