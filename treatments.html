<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="treatments.pageTitle">Treatments — Avalon</title>
  <meta name="description" data-i18n-content="treatments.metaDescription" content="">
  <!-- Brand marks. The SVG icon is the primary one and stays crisp at every
       size; the PNG covers iOS home screens and older browsers. -->
  <link rel="icon" href="images/brand/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="images/brand/appleTouchIcon.png">
  <meta name="theme-color" content="#1E1C19">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/avalon.css">

  <script>
    (function () {
      var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      if (!reduce) document.documentElement.classList.add("gsapReady");
    })();
  </script>
</head>

<body data-page="treatments">

  <noscript>
    <p class="noscriptNotice">This site needs JavaScript to display its content.</p>
  </noscript>

  <a class="skipLink" href="#mainContent" data-i18n="nav.skipToContent">Skip to main content</a>
  <div data-site-header></div>

  <main id="mainContent">

    <!-- ================================================================ HERO -->
    <section class="pageHero" data-hero>
      <div class="heroMedia" data-parallax="0.07">
        <img src="images/house/roomWindow.jpg" data-i18n-alt="media.altRoomWindow" alt="" fetchpriority="high">
      </div>
      <div class="heroScrim"></div>
      <div class="heroContent">
        <div class="sectionShell">
          <span class="eyebrow" data-hero-item data-i18n="treatments.heroEyebrow"></span>
          <h1 class="displayLg heroTitle" data-hero-item data-i18n="treatments.heroTitle"></h1>
          <p class="heroLede" data-hero-item data-i18n="treatments.heroLede"></p>
        </div>
      </div>
    </section>

    <!-- ============================================================= SUB NAV -->
    <nav class="subNav" aria-label="Sections of this page">
      <div class="subNavInner">
        <a class="subNavLink" href="#bpd"        data-i18n="navSub.bpdLong"></a>
        <a class="subNavLink" href="#depression" data-i18n="navSub.depression"></a>
        <a class="subNavLink" href="#anxiety"    data-i18n="navSub.anxiety"></a>
        <a class="subNavLink" href="#ptsd"       data-i18n="navSub.ptsd"></a>
        <a class="subNavLink" href="#cptsd"      data-i18n="navSub.cptsd"></a>
      </div>
    </nav>

    <!-- =============================================================== INTRO -->
    <section class="sectionBlock">
      <div class="sectionShell revealItem">
        <div class="stackMd" data-i18n-paras="treatments.introParagraphs" data-i18n-class="leadText"></div>
      </div>
    </section>

    <!-- ================================================================= BPD -->
    <section class="sectionBlock bandParchmentDeep" id="bpd">
      <div class="sectionShell">

        <div class="sectionHead revealItem">
          <span class="eyebrow" data-i18n="navSub.bpd"></span>
          <h2 class="displayLg" data-i18n="treatments.bpdTitle"></h2>
          <p class="leadText" data-i18n="treatments.bpdLead"></p>
        </div>

        <div class="contentSectionHead">
          <div class="contentSectionTitle revealItem">
            <h3 class="displaySm" data-i18n="treatments.bpdWhatTitle"></h3>
          </div>
          <div class="revealItem">
            <div class="stackMd" data-i18n-paras="treatments.bpdWhatParagraphs"></div>
          </div>
        </div>

        <div class="contentSectionHead">
          <div class="contentSectionTitle revealItem">
            <h3 class="displaySm" data-i18n="treatments.bpdSignsTitle"></h3>
          </div>
          <div class="revealItem">
            <ul class="signList" data-i18n-list="treatments.bpdSignsList"></ul>
          </div>
        </div>

        <div class="contentSectionHead">
          <div class="contentSectionTitle revealItem">
            <h3 class="displaySm" data-i18n="treatments.bpdMisdiagnosisTitle"></h3>
          </div>
          <div class="revealItem">
            <div class="stackMd" data-i18n-paras="treatments.bpdMisdiagnosisParagraphs"></div>
          </div>
        </div>

        <div class="contentSectionHead">
          <div class="contentSectionTitle revealItem">
            <h3 class="displaySm" data-i18n="treatments.bpdWhySpecialistTitle"></h3>
          </div>
          <div class="revealItem">
            <div class="stackMd" data-i18n-paras="treatments.bpdWhySpecialistParagraphs"></div>

            <!-- PLACEHOLDER: risk framing appears exactly once on this page, gently
                 and with a route to help. To be reviewed by the clinical team. -->
            <div class="calloutNote" data-i18n-paras="treatments.bpdCalloutParagraphs"></div>

            <p>
              <a class="linkQuiet" href="solutions.html#dbt">
                <span data-i18n="solutions.dbtTitle"></span>
                <span class="linkArrow" aria-hidden="true">&rarr;</span>
              </a>
            </p>
          </div>
        </div>

      </div>
    </section>

    <!-- ========================================================== DEPRESSION -->
    <section class="sectionBlock" id="depression">
      <div class="sectionShell">

        <div class="sectionHead revealItem">
          <span class="eyebrow" data-i18n="navSub.depression"></span>
          <h2 class="displayLg" data-i18n="treatments.depressionTitle"></h2>
          <p class="leadText" data-i18n="treatments.depressionLead"></p>
        </div>

        <div class="contentSectionHead">
          <div class="contentSectionTitle revealItem">
            <h3 class="displaySm" data-i18n="treatments.depressionSignsTitle"></h3>
          </div>
          <div class="revealItem">
            <div class="stackMd" data-i18n-paras="treatments.depressionWhatParagraphs"></div>
            <ul class="signList marginTopLg" data-i18n-list="treatments.depressionSignsList"></ul>
            <div class="stackMd marginTopLg" data-i18n-paras="treatments.depressionWhyParagraphs"></div>
          </div>
        </div>

      </div>
    </section>

    <!-- ============================================================= ANXIETY -->
    <section class="sectionBlock bandParchmentDeep" id="anxiety">
      <div class="sectionShell">

        <div class="sectionHead revealItem">
          <span class="eyebrow" data-i18n="navSub.anxiety"></span>
          <h2 class="displayLg" data-i18n="treatments.anxietyTitle"></h2>
          <p class="leadText" data-i18n="treatments.anxietyLead"></p>
        </div>

        <div class="contentSectionHead">
          <div class="contentSectionTitle revealItem">
            <h3 class="displaySm" data-i18n="treatments.anxietySignsTitle"></h3>
          </div>
          <div class="revealItem">
            <div class="stackMd" data-i18n-paras="treatments.anxietyWhatParagraphs"></div>
            <ul class="signList marginTopLg" data-i18n-list="treatments.anxietySignsList"></ul>
            <div class="stackMd marginTopLg" data-i18n-paras="treatments.anxietyWhyParagraphs"></div>
          </div>
        </div>

      </div>
    </section>

    <!-- ================================================================ PTSD -->
    <section class="sectionBlock" id="ptsd">
      <div class="sectionShell">

        <div class="sectionHead revealItem">
          <span class="eyebrow" data-i18n="navSub.ptsd"></span>
          <h2 class="displayLg" data-i18n="treatments.ptsdTitle"></h2>
          <p class="leadText" data-i18n="treatments.ptsdLead"></p>
        </div>

        <div class="contentSectionHead">
          <div class="contentSectionTitle revealItem">
            <h3 class="displaySm" data-i18n="treatments.ptsdSignsTitle"></h3>
          </div>
          <div class="revealItem">
            <div class="stackMd" data-i18n-paras="treatments.ptsdWhatParagraphs"></div>
            <ul class="signList marginTopLg" data-i18n-list="treatments.ptsdSignsList"></ul>
            <div class="stackMd marginTopLg" data-i18n-paras="treatments.ptsdWhyParagraphs"></div>
            <p class="marginTopLg">
              <a class="linkQuiet" href="solutions.html#emdr">
                <span data-i18n="treatments.ptsdLink"></span>
                <span class="linkArrow" aria-hidden="true">&rarr;</span>
              </a>
            </p>
          </div>
        </div>

      </div>
    </section>

    <!-- =============================================== COMPLEX TRAUMA / CPTSD -->
    <section class="sectionBlock bandParchmentDeep" id="cptsd">
      <div class="sectionShell">

        <div class="sectionHead revealItem">
          <span class="eyebrow" data-i18n="navSub.cptsd"></span>
          <h2 class="displayLg" data-i18n="treatments.cptsdTitle"></h2>
          <p class="leadText" data-i18n="treatments.cptsdLead"></p>
        </div>

        <div class="splitBlock">
          <div class="splitMedia revealItem">
            <img src="images/house/gardenStoneSteps.jpg" data-i18n-alt="media.altGardenSteps" alt="" loading="lazy">
          </div>
          <div class="revealItem">
            <div class="stackMd" data-i18n-paras="treatments.cptsdWhatParagraphs"></div>
            <p class="marginTopLg">
              <a class="linkQuiet" href="solutions.html#emdr">
                <span data-i18n="treatments.ptsdLink"></span>
                <span class="linkArrow" aria-hidden="true">&rarr;</span>
              </a>
            </p>
          </div>
        </div>

      </div>
    </section>

    <!-- ================================================================= CTA -->
    <section class="sectionBlock ctaBand">
      <div class="sectionShell">
        <div class="ctaBandInner revealItem">
          <div>
            <span class="eyebrow" data-i18n="cta.eyebrow"></span>
            <h2 class="displayLg" data-i18n="cta.title"></h2>
            <p class="bodyText marginTopLg" data-i18n="cta.body"></p>
          </div>
          <div>
            <a class="buttonGhost" href="admissions.html#waitlist" data-i18n="cta.button"></a>
            <p class="marginTopLg">
              <a class="linkQuiet" href="admissions.html#process">
                <span data-i18n="cta.secondary"></span>
                <span class="linkArrow" aria-hidden="true">&rarr;</span>
              </a>
            </p>
            <p class="ctaBandAside marginTopLg" data-i18n="cta.aside"></p>
          </div>
        </div>
      </div>
    </section>

  </main>

  <div data-site-footer></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
  <script src="js/content.en.js"></script>
  <script src="js/content.pt.js"></script>
  <script src="js/chrome.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/avalon.js"></script>
  <script src="js/animations.js"></script>
</body>
</html>
