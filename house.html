<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="house.pageTitle">The House | Avalon</title>
  <meta name="description" data-i18n-content="house.metaDescription" content="">
  <!-- Brand marks. The SVG icon is the primary one and stays crisp at every
       size; the PNG covers iOS home screens and older browsers. -->
  <link rel="icon" href="images/brand/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="images/brand/appleTouchIcon.png">
  <meta name="theme-color" content="#1E1C19">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/avalon.css">

  <script>
    (function () {
      var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      if (!reduce) document.documentElement.classList.add("gsapReady");
    })();
  </script>
</head>

<body data-page="house">

  <noscript>
    <p class="noscriptNotice">This site needs JavaScript to display its content.</p>
  </noscript>

  <a class="skipLink" href="#mainContent" data-i18n="nav.skipToContent">Skip to main content</a>
  <div data-site-header></div>

  <main id="mainContent">

    <!-- ================================================================ HERO -->
    <section class="pageHero" data-hero>
      <div class="heroMedia" data-parallax="0.07">
        <img src="images/house/houseFacade.jpg" data-i18n-alt="media.altFacade" alt="" fetchpriority="high">
      </div>
      <div class="heroScrim"></div>
      <div class="heroContent">
        <div class="sectionShell">
          <h1 class="displayLg heroTitle" data-hero-item data-i18n="house.heroEyebrow"></h1>
        </div>
      </div>
    </section>

    <!-- ============================================================= SUB NAV -->
    <nav class="subNav" aria-label="Sections of this page">
      <div class="subNavInner">
        <a class="subNavLink" href="#rooms"         data-i18n="navSub.rooms"></a>
        <a class="subNavLink" href="#commonAreas"   data-i18n="navSub.commonAreas"></a>
        <a class="subNavLink" href="#outdoorSpaces" data-i18n="navSub.outdoorSpaces"></a>
        <a class="subNavLink" href="#whySintra"     data-i18n="navSub.whySintra"></a>
      </div>
    </nav>

    <!-- =============================================================== ROOMS -->
    <section class="sectionBlock bandParchmentDeep" id="rooms">
      <div class="sectionShell">

        <div class="sectionHead shellMid revealItem shellFlush">
          <h2 class="displayLg" data-i18n="house.roomsTitle"></h2>
          <div class="stackMd marginTopLg" data-i18n-paras="house.roomsParagraphs"></div>
          <!-- PLACEHOLDER: no room counts or interior specifics until the fit-out is confirmed. -->
        </div>

      </div>
    </section>

    <!-- ======================================================== COMMON AREAS -->
    <section class="sectionBlock" id="commonAreas">
      <div class="sectionShell">

        <div class="splitBlock">
          <div class="splitMedia mediaLandscape revealItem">
            <img src="images/house/commonSalon.jpg" data-i18n-alt="media.altSalon" alt="" loading="lazy">
          </div>
          <div class="revealItem">
            <h2 class="displayMd" data-i18n="house.commonAreasTitle"></h2>
            <div class="stackMd marginTopLg" data-i18n-paras="house.commonAreasParagraphs"></div>
            <!-- PLACEHOLDER: final layout and use of the common rooms to follow. -->
          </div>
        </div>

        <div class="photoStrip revealStagger marginTopXl">
          <figure>
            <img src="images/house/commonDiningRoom.jpg" data-i18n-alt="media.altDiningRoom" alt="" loading="lazy">
          </figure>
          <figure>
            <img src="images/house/interiorStaircase.jpg" data-i18n-alt="media.altStaircase" alt="" loading="lazy">
          </figure>
          <figure>
            <img src="images/house/interiorCorridor.jpg" data-i18n-alt="media.altCorridor" alt="" loading="lazy">
          </figure>
          <figure>
            <img src="images/house/commonSittingRoom.jpg" data-i18n-alt="media.altSittingRoom" alt="" loading="lazy">
          </figure>
        </div>

      </div>
    </section>

    <!-- ====================================================== OUTDOOR SPACES -->
    <section class="sectionBlock bandParchmentDeep" id="outdoorSpaces">
      <div class="sectionShell">

        <div class="sectionHead shellMid revealItem shellFlush">
          <h2 class="displayLg" data-i18n="house.outdoorTitle"></h2>
        </div>

        <div class="splitBlock">
          <div class="splitMedia revealItem">
            <img src="images/house/gardenPath.jpg" data-i18n-alt="media.altGardenPath" alt="" loading="lazy">
          </div>
          <div class="revealItem">
            <div class="stackMd" data-i18n-paras="house.outdoorParagraphs"></div>
          </div>
        </div>

        <div class="photoStrip revealStagger marginTopXl">
          <figure>
            <img src="images/house/gardenStoneSteps.jpg" data-i18n-alt="media.altGardenSteps" alt="" loading="lazy">
          </figure>
          <figure>
            <img src="images/house/gardenFountain.jpg" data-i18n-alt="media.altGardenFountain" alt="" loading="lazy">
          </figure>
          <figure>
            <img src="images/house/gardenWalledPath.jpg" data-i18n-alt="media.altGardenWalledPath" alt="" loading="lazy">
          </figure>
          <figure>
            <img src="sources/fotosExt/spa.jpg" data-i18n-alt="media.altGardenUndergrowth" alt="" loading="lazy">
          </figure>
        </div>

      </div>
    </section>

    <!-- ================================================= WHY SINTRA — band -->
    <section class="imageBand">
      <div class="imageBandMedia" data-parallax="0.1">
        <img src="images/house/terraceCastleView.jpg" data-i18n-alt="media.altCastleView" alt="" loading="lazy">
      </div>
    </section>

    <!-- =========================================== WHY SINTRA — the reasoning -->
    <section class="sectionBlock" id="whySintra">
      <div class="sectionShell">
        <div class="contentSectionHead">
          <div class="contentSectionTitle revealItem">
            <h2 class="displayMd" data-i18n="house.sintraTitle"></h2>
          </div>
          <div class="revealItem">
            <div class="stackMd" data-i18n-paras="house.sintraParagraphs"></div>
          </div>
        </div>
      </div>
    </section>

    <!-- ================================================================= CTA -->
    <section class="sectionBlock ctaBand">
      <div class="sectionShell">
        <div class="ctaBandInner revealItem">
          <div>
            <span class="eyebrow" data-i18n="cta.eyebrow"></span>
            <h2 class="displayLg" data-i18n="cta.title"></h2>
            <p class="bodyText marginTopLg" data-i18n="cta.body"></p>
          </div>
          <div>
            <a class="buttonGhost" href="admissions.html#waitlist" data-i18n="cta.button"></a>
            <p class="marginTopLg">
              <a class="linkQuiet" href="admissions.html#process">
                <span data-i18n="cta.secondary"></span>
                <span class="linkArrow" aria-hidden="true">&rarr;</span>
              </a>
            </p>
            <p class="ctaBandAside marginTopLg" data-i18n="cta.aside"></p>
          </div>
        </div>
      </div>
    </section>

  </main>

  <div data-site-footer></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
  <script src="js/content.en.js"></script>
  <script src="js/content.pt.js"></script>
  <script src="js/chrome.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/avalon.js"></script>
  <script src="js/animations.js"></script>
</body>
</html>
